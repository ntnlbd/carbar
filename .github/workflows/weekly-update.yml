name: Weekly stock update

# Scrapes carbarsale.ie every Saturday at 09:00 UTC, updates the JSON data
# files, rebuilds the dashboard, commits the changes back to the repo, and
# publishes docs/ to GitHub Pages. Can also be run on demand from the Actions
# tab (or `gh workflow run weekly-update.yml`).
on:
  schedule:
    - cron: "0 9 * * 6" # every Saturday 09:00 UTC
  workflow_dispatch:

# contents: write  -> commit the refreshed data + dashboard back to the repo
# pages: write / id-token: write -> deploy docs/ to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Never run two Pages deploys at once; let an in-flight run finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape and update data
        # Exits non-zero (failing the run) if it parses 0 cars, so a broken
        # scrape shows up as a red X instead of corrupting the history.
        run: python3 scripts/scrape_and_update.py

      - name: Rebuild dashboard
        run: python3 scripts/generate_dashboard.py

      - name: Commit updated data and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly stock update ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
